[package]
name = "sat-bench"
description = "A small utilities for SAT solver benchmarking"
version = "0.17.4"
authors = ["Narazaki Shuji <shujinarazaki@protonmail.com>"]
edition = "2024"
default-run = "sat-bench"
rust-version = "1.97"

[dependencies]
chrono ="^0.4"
clap = { version = "^4.6", features = ["derive"] }
futures = "^0.3"
once_cell = "^1.21"
regex = "^1.12"
tokio = { version = "^1.52", features = ["full"] }
matrix-sdk = { version = "^0.18", optional = true }
ruma = { version = "^0.16", optional = true }
url = { version = "^2.5", optional = true }

[features]
default = [ ]
matrix = [ "matrix-sdk", "ruma", "url" ]
